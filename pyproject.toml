[project]
name = "lunar-rl"
version = "0.1.0"
description = "Deep RL agents (DQN, PPO) implemented from scratch in PyTorch to solve Gymnasium's LunarLander-v3."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.12"
dependencies = [
    "gymnasium[box2d]>=1.0",
    "torch>=2.2",
    "stable-baselines3>=2.4",
    "numpy",
    "pandas",
    "matplotlib",
    "pyyaml",
    "imageio",
    "pillow",
    "tensorboard",
    "tqdm",
    "rich",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lunar_rl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]
