name: ppo_lr_1e-3
algo: ppo
seeds:
- 0
- 1
- 2
env:
  enable_wind: false
  wind_power: 15.0
  turbulence_power: 1.5
train:
  total_timesteps: 1000000
  n_envs: 16
  device: cpu
  torch_threads: 1
eval:
  freq: 32768
  n_episodes: 10
  seed_start: 1000
ppo:
  hidden_sizes:
  - 64
  - 64
  learning_rate: 0.001
  n_steps: 1024
  batch_size: 64
  n_epochs: 4
  gamma: 0.999
  gae_lambda: 0.98
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  normalize_advantage: true
  adam_eps: 1.0e-05
